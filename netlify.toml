# Publicação contínua a partir do GitHub.
#
# O site do Netlify nasceu de um arrasta-e-solta de zip ("deploy_source": "drop"),
# e por isso nunca escutou o repositório: atualizar o GitHub não publicava nada.
# Depois de ligar o repositório em Site configuration → Build & deploy, este
# arquivo diz ao Netlify o que fazer a cada push na branch main.
#
# v18.44 (12/10/2026) — página inicial e app no mesmo endereço:
#   /      → a página inicial do Gera Enem (pasta pagina/: index.html, _headers e assets/)
#   /app/  → o aplicativo (index.html da raiz do repositório, gerado por src/combine.py)
# O login e o cadastro são feitos na página inicial; como o endereço é o mesmo, a sessão
# do Supabase vale no app. Não há dependências para instalar nem empacotador para rodar:
# o "build" só monta dist/ com os dois, para que o código-fonte (src/, supabase/, tests/)
# não seja publicado junto.
[build]
  command = "rm -rf dist && mkdir -p dist/app && cp -R pagina/. dist/ && cp index.html dist/app/index.html"
  publish = "dist"
